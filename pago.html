<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago - Barber Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="max-w-xl mx-auto border border-black min-h-dvh bg-gradient-to-b from-black to-gray-500">
    <!-- Botón de regresar fijo -->
    <a href="index.html" class="fixed top-4 left-4 bg-white/20 hover:bg-white/30 text-white p-2 rounded-full transition z-50" title="Regresar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 19l-7-7 7-7"></path>
        </svg>
    </a>

    <header class="text-white flex items-center justify-between px-4 py-4">
    </header>

    <!-- Sección de Información de Pago -->
    <section id="pago" class="py-8 px-4 text-white precios-container min-h-96">
        <img alt="Barber Studio Logo Fondo" src="assets/img/logo.webp" class="logo-bg">
        <div class="precios-content">
            <h2 class="text-2xl font-bold mb-6 text-left">Métodos de Pago</h2>
            <div class="space-y-4">
                <div class="bg-gray-800/50 p-4 rounded-lg border border-gray-700">
                    <h3 class="font-bold text-lg mb-4">Pago con Transferencia </h3>
                    <div class="space-y-3">
                        <div>
                            <p class="text-gray-400 text-sm">Número de Cuenta:</p>
                            <div class="flex items-center justify-between gap-2">
                                <p class="text-white font-semibold">4169 1611 0404 0901</p>
                                <button onclick="copiarNumero(this, '4169 1611 0404 0901')" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm transition" title="Copiar número">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div>
                            <p class="text-gray-400 text-sm">Nombre del Titular:</p>
                            <p class="text-white font-semibold">Caleb Pérez</p>
                        </div>
                        <div>
                            <p class="text-gray-400 text-sm">Banco:</p>
                            <p class="text-white font-semibold">BanCoppel </p>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-800/50 p-4 rounded-lg border border-gray-700">
                    <h3 class="font-bold text-lg mb-2">Otras opciones de pago</h3>
                    <p class="text-gray-300 text-sm">También puedes pagar mediante efectivo en la barbería.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Botón Flotante para Agendar por WhatsApp -->
    <a href="https://wa.me/526462413522" class="fixed bottom-8 right-4 bg-green-500 hover:bg-green-600 text-white p-4 rounded-full shadow-lg flex items-center justify-center transition transform hover:scale-110 z-40" title="Agendar cita por WhatsApp" target="_blank" rel="noopener noreferrer">
        <svg width="24" height="24">
            <use xlink:href="assets/icons/sprite.svg#icon-whatsapp"></use>
        </svg>
    </a>

    <!-- Footer con Redes Sociales -->
    <footer class="bg-black/90 text-white py-6 px-4 mt-8 border-t border-gray-700">
        <div class="flex flex-col items-center gap-4">
            <h3 class="font-semibold text-lg">Síguenos</h3>
            <div class="flex gap-4 justify-center">
                <a class="bg-blue-700 p-2 w-12 h-12 flex items-center justify-center rounded-full hover:scale-110 transition-transform" href="https://www.facebook.com/profile.php?id=61581620253403&locale=es_LA" target="_blank" rel="noopener noreferrer">
                    <svg width="28" height="28">
                        <use xlink:href="assets/icons/sprite.svg#icon-facebook"></use>
                    </svg>
                </a>
                <a class="bg p-2 w-12 h-12 flex items-center justify-center rounded-full hover:scale-110 transition-transform bg-gradient-to-tr from-yellow-500 via-pink-500 to-purple-900" href="https://www.instagram.com/barberstudio/" target="_blank" rel="noopener noreferrer">
                    <svg width="28" height="28">
                        <use xlink:href="assets/icons/sprite.svg#icon-instagram"></use>
                    </svg>
                </a>
                <a class="bg-slate-900 p-2 w-12 h-12 flex items-center justify-center rounded-full hover:scale-110 transition-transform" href="https://www.tiktok.com/@barberstudio" target="_blank" rel="noopener noreferrer">
                    <svg width="28" height="28">
                        <use xlink:href="assets/icons/sprite.svg#icon-tiktok"></use>
                    </svg>
                </a>
            </div>
            <p class="text-sm text-gray-400">© 2026 Barber Studio. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        function copiarNumero(btn, numero) {
            navigator.clipboard.writeText(numero).then(() => {
                const textoOriginal = btn.innerHTML;
                btn.innerHTML = '<span class="text-xs">¡Copiado!</span>';
                btn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                btn.classList.add('bg-green-500', 'hover:bg-green-600');
                
                setTimeout(() => {
                    btn.innerHTML = textoOriginal;
                    btn.classList.remove('bg-green-500', 'hover:bg-green-600');
                    btn.classList.add('bg-blue-500', 'hover:bg-blue-600');
                }, 2000);
            });
        }
    </script>

    <script src="js/main.js"></script>
</body>
</html>
